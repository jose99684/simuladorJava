<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador – Sistema Gestión Académica</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #060810;
  --panel: #0c1020;
  --panel2: #111828;
  --cyan: #00ffe7;
  --green: #39ff14;
  --yellow: #ffe000;
  --red: #ff3d6b;
  --purple: #bf7fff;
  --orange: #ff9500;
  --dim: #2a3550;
  --text: #c8d8f0;
  --muted: #3a4a6a;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* scanline effect */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events:none;
  z-index:999;
}

/* ===== TOP BAR ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  border-bottom: 1px solid var(--dim);
  background: var(--panel);
  flex-shrink: 0;
}

.topbar-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.4rem;
  letter-spacing: 4px;
  color: var(--cyan);
  text-shadow: 0 0 20px rgba(0,255,231,0.5);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.progress-bar-wrap {
  width: 200px;
  height: 6px;
  background: var(--dim);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 3px;
  transition: width 0.1s linear;
  box-shadow: 0 0 8px rgba(0,255,231,0.6);
}

.timer-display {
  font-size: 0.72rem;
  color: var(--cyan);
  letter-spacing: 2px;
  min-width: 50px;
  text-align: right;
}

.cycle-badge {
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: var(--muted);
  padding: 3px 10px;
  border: 1px solid var(--dim);
  border-radius: 2px;
}

/* ===== MAIN LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr 280px;
  grid-template-rows: 1fr;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ===== PANELS ===== */
.panel {
  border-right: 1px solid var(--dim);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--dim);
  font-size: 0.62rem;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  background: var(--panel);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.panel-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-cyan { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot-purple { background: var(--purple); box-shadow: 0 0 6px var(--purple); }

/* ===== LEFT: STEPS ===== */
.steps-panel { background: var(--panel); }

.step-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: all 0.3s;
  position: relative;
  cursor: default;
}

.step-item.active {
  background: rgba(0,255,231,0.05);
  border-left: 3px solid var(--cyan);
}

.step-item.done {
  background: rgba(57,255,20,0.03);
  border-left: 3px solid var(--green);
}

.step-item.pending {
  opacity: 0.35;
  border-left: 3px solid transparent;
}

.step-num {
  width: 26px; height: 26px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 1px;
}

.step-item.active .step-num {
  background: rgba(0,255,231,0.2);
  color: var(--cyan);
  border: 1px solid rgba(0,255,231,0.5);
  animation: pulse-cyan 1s infinite;
}

.step-item.done .step-num {
  background: rgba(57,255,20,0.15);
  color: var(--green);
  border: 1px solid rgba(57,255,20,0.4);
}

.step-item.pending .step-num {
  background: var(--dim);
  color: var(--muted);
  border: 1px solid var(--muted);
}



.step-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}

.step-item.active .step-label { color: var(--cyan); }
.step-item.done .step-label { color: var(--green); }

.step-desc {
  font-size: 0.62rem;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.4;
}

.step-tag {
  display: inline-block;
  font-size: 0.55rem;
  padding: 2px 7px;
  border-radius: 2px;
  margin-top: 5px;
  letter-spacing: 1px;
  font-weight: 700;
}

.tag-herencia { background: rgba(191,127,255,0.15); color: var(--purple); border: 1px solid rgba(191,127,255,0.3); }
.tag-interfaz { background: rgba(0,255,231,0.1); color: var(--cyan); border: 1px solid rgba(0,255,231,0.3); }
.tag-composicion { background: rgba(255,61,107,0.12); color: var(--red); border: 1px solid rgba(255,61,107,0.3); }
.tag-agregacion { background: rgba(0,255,231,0.08); color: #7ecfff; border: 1px solid rgba(126,207,255,0.3); }
.tag-asociacion { background: rgba(57,255,20,0.08); color: var(--green); border: 1px solid rgba(57,255,20,0.3); }
.tag-dependencia { background: rgba(255,149,0,0.1); color: var(--orange); border: 1px solid rgba(255,149,0,0.3); }
.tag-polimorfismo { background: rgba(255,224,0,0.1); color: var(--yellow); border: 1px solid rgba(255,224,0,0.3); }

/* ===== CENTER: CODE DISPLAY ===== */
.code-panel { background: #070a12; border-right: 1px solid var(--dim); }

.code-scroll {
  flex: 1;
  overflow: hidden;
  padding: 20px 24px;
  position: relative;
}

.code-content {
  font-size: 0.8rem;
  line-height: 1.9;
  white-space: pre;
  transition: opacity 0.3s;
}

/* Line highlight */
.code-line {
  display: block;
  padding: 0 8px;
  border-radius: 2px;
  transition: all 0.2s;
  border-left: 2px solid transparent;
}

.code-line.highlight {
  background: rgba(0,255,231,0.08);
  border-left-color: var(--cyan);
  color: #fff;
}

.code-line.highlight-done {
  background: rgba(57,255,20,0.05);
  border-left-color: var(--green);
}

/* Syntax */
.kw { color: #ff79c6; }
.cl { color: #8be9fd; }
.fn { color: #50fa7b; }
.st { color: #f1fa8c; }
.cm { color: #44607a; font-style: italic; }
.nm { color: #ffb86c; }
.op { color: #ff79c6; }

/* Cursor blink */
.cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: var(--cyan);
  animation: blink 0.7s infinite;
  vertical-align: middle;
  margin-left: 4px;
  border-radius: 1px;
  box-shadow: 0 0 8px var(--cyan);
}

/* ===== RIGHT: OUTPUT + OBJECTS ===== */
.right-col {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  overflow: hidden;
}

.output-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--dim);
  overflow: hidden;
}

.output-lines {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--dim) transparent;
}

.output-line {
  font-size: 0.68rem;
  line-height: 1.8;
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.3s;
  color: var(--green);
}

.output-line.visible {
  opacity: 1;
  transform: none;
}

.output-line.header {
  color: var(--cyan);
  font-weight: 700;
  letter-spacing: 1px;
}

.output-line.info { color: var(--yellow); }
.output-line.sys { color: var(--purple); }

/* ===== OBJECTS STATE ===== */
.objects-panel {
  flex-shrink: 0;
  max-height: 200px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--dim) transparent;
}

.obj-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px;
}

.obj-card {
  background: var(--panel2);
  border: 1px solid var(--dim);
  border-radius: 3px;
  padding: 8px 10px;
  font-size: 0.6rem;
  opacity: 0.3;
  transition: all 0.4s;
}

.obj-card.alive {
  opacity: 1;
  border-color: rgba(0,255,231,0.3);
  box-shadow: 0 0 8px rgba(0,255,231,0.1);
}

.obj-card.active {
  border-color: var(--cyan);
  background: rgba(0,255,231,0.07);
  box-shadow: 0 0 14px rgba(0,255,231,0.2);
}

.obj-type {
  color: var(--purple);
  font-weight: 700;
  font-size: 0.58rem;
  letter-spacing: 1px;
  margin-bottom: 3px;
}

.obj-name { color: var(--cyan); font-weight: 700; font-size: 0.65rem; }
.obj-attr { color: var(--muted); font-size: 0.57rem; margin-top: 1px; line-height: 1.5; }
.obj-attr span { color: var(--text); }

/* ===== ANIMATIONS ===== */
@keyframes pulse-cyan {
  0%,100% { box-shadow: 0 0 4px rgba(0,255,231,0.4); }
  50% { box-shadow: 0 0 12px rgba(0,255,231,0.9); }
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes slideIn {
  from { opacity:0; transform:translateY(-6px); }
  to { opacity:1; transform:none; }
}

/* ===== RELATION FLASH ===== */
.relation-flash {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: rgba(6,8,16,0.95);
  border: 2px solid var(--cyan);
  border-radius: 6px;
  padding: 24px 40px;
  text-align: center;
  font-family: 'Bebas Neue', cursive;
  font-size: 2.2rem;
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: 0 0 30px rgba(0,255,231,0.8);
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  box-shadow: 0 0 60px rgba(0,255,231,0.3);
}

.relation-flash.show { opacity: 1; }
.relation-flash .rel-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 3px;
  margin-top: 6px;
  display: block;
}

/* control buttons */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 24px;
  border-top: 1px solid var(--dim);
  background: var(--panel);
  flex-shrink: 0;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 2px;
  padding: 6px 16px;
  border-radius: 2px;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}

.btn-cyan { border-color: var(--cyan); color: var(--cyan); background: rgba(0,255,231,0.08); }
.btn-cyan:hover { background: rgba(0,255,231,0.18); }
.btn-dim { border-color: var(--dim); color: var(--muted); background: transparent; }
.btn-dim:hover { border-color: var(--muted); color: var(--text); }

.speed-label { font-size: 0.6rem; color: var(--muted); letter-spacing: 1px; }
.speed-select {
  background: var(--panel2);
  border: 1px solid var(--dim);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  padding: 4px 8px;
  border-radius: 2px;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">SISTEMA GESTIÓN ACADÉMICA · JAVA SIMULATOR</div>
  <div class="topbar-right">
    <span class="cycle-badge" id="cycleLabel">CICLO 1</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="timer-display" id="timerDisplay">00.0s</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: STEPS -->
  <div class="panel steps-panel">
    <div class="panel-header"><div class="panel-dot dot-cyan"></div>PASOS DE EJECUCIÓN</div>
    <div id="stepsList" style="overflow-y:auto;flex:1"></div>
  </div>

  <!-- CENTER: CODE -->
  <div class="panel code-panel">
    <div class="panel-header"><div class="panel-dot dot-green"></div>CÓDIGO JAVA · <span id="codeLabel" style="color:var(--cyan)">Main.java</span></div>
    <div class="code-scroll">
      <div class="code-content" id="codeDisplay"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-col">
    <div class="output-panel">
      <div class="panel-header"><div class="panel-dot dot-yellow"></div>CONSOLA DE SALIDA</div>
      <div class="output-lines" id="outputLines"></div>
    </div>
    <div class="objects-panel">
      <div class="panel-header" style="border-top:1px solid var(--dim)"><div class="panel-dot dot-purple"></div>OBJETOS EN MEMORIA</div>
      <div class="obj-grid" id="objGrid"></div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn btn-cyan" id="btnPlayPause">⏸ PAUSAR</button>
  <button class="btn btn-dim" id="btnRestart">↺ REINICIAR</button>
  <span class="speed-label">VELOCIDAD:</span>
  <select class="speed-select" id="speedSelect">
    <option value="1">× 1 Normal</option>
    <option value="1.5">× 1.5</option>
    <option value="2">× 2 Rápido</option>
    <option value="0.5">× 0.5 Lento</option>
  </select>
</div>

<!-- RELATION FLASH -->
<div class="relation-flash" id="relFlash">
  <span id="relFlashText">HERENCIA</span>
  <span class="rel-sub" id="relFlashSub">extends MiembroUniversitario</span>
</div>

<script>
// ============================================================
// SIMULATION DATA
// ============================================================

const CODE_BLOCKS = {
  abstracta: `<span class="cm">// ① CLASE ABSTRACTA MADRE</span>
<span class="kw">abstract class</span> <span class="cl">MiembroUniversitario</span> {
  <span class="kw">private</span> <span class="cl">String</span> codigo;
  <span class="kw">private</span> <span class="cl">String</span> nombre;

  <span class="kw">public</span> <span class="fn">MiembroUniversitario</span>(<span class="cl">String</span> codigo, <span class="cl">String</span> nombre) {
    <span class="kw">this</span>.codigo = codigo;
    <span class="kw">this</span>.nombre = nombre;
  }

  <span class="cm">// Método abstracto: obliga a cada subclase</span>
  <span class="kw">public abstract double</span> <span class="fn">calcularCarga</span>();<span class="cursor"></span>
}`,

  estudiante: `<span class="cm">// ② HERENCIA: Estudiante extends MiembroUniversitario</span>
<span class="kw">class</span> <span class="cl">Estudiante</span> <span class="kw">extends</span> <span class="cl">MiembroUniversitario</span> {
  <span class="kw">private double</span> promedio;
  <span class="kw">private int</span> creditosInscritos;

  <span class="kw">public</span> <span class="fn">Estudiante</span>(<span class="cl">String</span> cod, <span class="cl">String</span> nom,
                      <span class="kw">double</span> prom, <span class="kw">int</span> cred) {
    <span class="kw">super</span>(cod, nom); <span class="cm">// ← hereda codigo y nombre</span>
    <span class="kw">this</span>.promedio = prom;
    <span class="kw">this</span>.creditosInscritos = cred;
  }

  <span class="kw">public double</span> <span class="fn">calcularCarga</span>() {
    <span class="kw">return</span> creditosInscritos * <span class="nm">3.0</span>; <span class="cm">// 3h/crédito</span>
  }<span class="cursor"></span>
}`,

  docente: `<span class="cm">// ③ HERENCIA + INTERFAZ</span>
<span class="kw">class</span> <span class="cl">Docente</span> <span class="kw">extends</span> <span class="cl">MiembroUniversitario</span>
              <span class="kw">implements</span> <span class="cl">Evaluador</span> {
  <span class="kw">private double</span> salario;
  <span class="kw">private</span> <span class="cl">String</span> categoria;

  <span class="kw">public double</span> <span class="fn">calcularCarga</span>() {
    <span class="kw">return</span> <span class="nm">20.0</span>; <span class="cm">// 20h fijas/semana</span>
  }

  <span class="kw">public void</span> <span class="fn">evaluar</span>() {
    <span class="cl">System</span>.out.<span class="fn">println</span>(<span class="st">"Evaluando examen final..."</span>);
  }
  <span class="kw">public void</span> <span class="fn">publicarNotas</span>() {
    <span class="cl">System</span>.out.<span class="fn">println</span>(<span class="st">"Notas publicadas en sistema."</span>);
  }<span class="cursor"></span>
}`,

  silabo: `<span class="cm">// ④ COMPOSICIÓN: Silabo pertenece a Curso</span>
<span class="kw">class</span> <span class="cl">Silabo</span> {
  <span class="kw">private</span> <span class="cl">String</span> codigoSilabo;
  <span class="kw">private</span> <span class="cl">String</span> contenido;

  <span class="kw">public</span> <span class="fn">Silabo</span>(<span class="cl">String</span> cod, <span class="cl">String</span> contenido) {
    <span class="kw">this</span>.codigoSilabo = cod;
    <span class="kw">this</span>.contenido = contenido;
  }
  <span class="kw">public</span> <span class="cl">String</span> <span class="fn">getContenido</span>() {
    <span class="kw">return</span> contenido;
  }<span class="cursor"></span>
}

<span class="cm">// Silabo asignado al Curso (composición 1:1)</span>
curso1.<span class="fn">setSilabo</span>(silabo1);`,

  curso: `<span class="cm">// ⑤ CURSO: Agregación + Composición</span>
<span class="kw">class</span> <span class="cl">Curso</span> {
  <span class="kw">private</span> <span class="cl">MiembroUniversitario</span>[] miembros;
  <span class="kw">private</span> <span class="cl">Silabo</span> silabo; <span class="cm">// composición</span>

  <span class="kw">public boolean</span> <span class="fn">agregarMiembro</span>(<span class="cl">MiembroUniversitario</span> m) {
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nm">0</span>; i < miembros.length; i++) {
      <span class="kw">if</span> (miembros[i] == <span class="kw">null</span>) {
        miembros[i] = m; <span class="cm">// AGREGACIÓN</span>
        <span class="kw">return true</span>;
      }
    }
    <span class="kw">return false</span>;
  }<span class="cursor"></span>
}`,

  servicio: `<span class="cm">// ⑥ DEPENDENCIA: ServicioMatricula usa objetos</span>
<span class="kw">class</span> <span class="cl">ServicioMatricula</span> {

  <span class="kw">public void</span> <span class="fn">registrarInscripcion</span>(
      <span class="cl">Estudiante</span> estudiante, <span class="cl">Curso</span> curso) {

    <span class="cm">// ASOCIACIÓN Estudiante ↔ Curso</span>
    estudiante.<span class="fn">setCreditosInscritos</span>(
      estudiante.<span class="fn">getCreditosInscritos</span>() + <span class="nm">3</span>
    );
    curso.<span class="fn">agregarMiembro</span>(estudiante);

    <span class="cl">System</span>.out.<span class="fn">println</span>(
      <span class="st">"Matriculando: "</span> + estudiante.<span class="fn">getNombre</span>()
    );<span class="cursor"></span>
  }
}`,

  main: `<span class="cm">// ⑦ MAIN: objetos + ejecución</span>
<span class="cl">Estudiante</span> est1 = <span class="kw">new</span> <span class="cl">Estudiante</span>(<span class="st">"333"</span>, <span class="st">"Juan"</span>, <span class="nm">15.5</span>, <span class="nm">1</span>);
<span class="cl">Docente</span> doc1 = <span class="kw">new</span> <span class="cl">Docente</span>(<span class="st">"555"</span>, <span class="st">"Carlos"</span>, <span class="nm">4500.0</span>, <span class="st">"Principal"</span>);
<span class="cl">Curso</span> curso1 = <span class="kw">new</span> <span class="cl">Curso</span>(<span class="st">"222"</span>, <span class="st">"Biología"</span>, <span class="nm">50</span>);
<span class="cl">Silabo</span> sil = <span class="kw">new</span> <span class="cl">Silabo</span>(<span class="st">"7771"</span>, <span class="st">"Plan Biología"</span>);

curso1.<span class="fn">setSilabo</span>(sil);               <span class="cm">// ◆ composición</span>
servicio.<span class="fn">registrarInscripcion</span>(est1, curso1); <span class="cm">// dependencia</span>

// ============================================================
// STATE
// ============================================================
let currentStep = 0;
let cycleCount = 1;
let paused = false;
let stepTimer = null;
let progressTimer = null;
let elapsedMs = 0;
let totalCycleMs = 0;
let aliveObjects = new Set();
let allOutputLines = [];
let speed = 1;

// ============================================================
// BUILD UI
// ============================================================
function buildStepsList() {
  const container = document.getElementById('stepsList');
  container.innerHTML = '';
  STEPS.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step-item pending';
    div.id = 'step-' + i;
    div.innerHTML = `
      <div class="step-num">${i+1}</div>
      <div class="step-info">
        <div class="step-label">${s.label}</div>
        <div class="step-desc">${s.desc}</div>
        <span class="step-tag ${s.tag}">${s.tagLabel}</span>
      </div>`;
    container.appendChild(div);
  });
}

function buildObjGrid() {
  const grid = document.getElementById('objGrid');
  grid.innerHTML = '';
  Object.entries(OBJECTS_DEF).forEach(([key, obj]) => {
    const div = document.createElement('div');
    div.className = 'obj-card';
    div.id = 'obj-' + key;
    div.innerHTML = `
      <div class="obj-type">${obj.type}</div>
      <div class="obj-name">${obj.name}</div>
      <div class="obj-attr">${obj.attrs.map(a => {
        const [k,v] = a.split(':');
        return `${k}: <span>${v}</span>`;
      }).join('<br>')}</div>`;
    grid.appendChild(div);
  });
}

// ============================================================
// FLASH RELATION
// ============================================================
function flashRelation(text, sub) {
  const el = document.getElementById('relFlash');
  document.getElementById('relFlashText').textContent = text;
  document.getElementById('relFlashSub').textContent = sub;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

// ============================================================
// STEP EXECUTION
// ============================================================
function activateStep(idx) {
  currentStep = idx;
  const step = STEPS[idx];

  // Update step list visual
  STEPS.forEach((_, i) => {
    const el = document.getElementById('step-' + i);
    if (i < idx) el.className = 'step-item done';
    else if (i === idx) { el.className = 'step-item active'; el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    else el.className = 'step-item pending';
  });

  // Code display
  document.getElementById('codeDisplay').innerHTML = CODE_BLOCKS[step.code];
  document.getElementById('codeLabel').textContent = step.file;

  // Flash relation
  flashRelation(step.rel, step.relSub);

  // Output lines
  if (step.outputs.length > 0) {
    step.outputs.forEach((o, delay) => {
      setTimeout(() => addOutputLine(o.text, o.cls), delay * 350 / speed);
    });
  }

  // Activate objects
  step.objects.forEach(key => {
    aliveObjects.add(key);
    const el = document.getElementById('obj-' + key);
    if (el) {
      el.classList.add('alive', 'active');
      setTimeout(() => el.classList.remove('active'), 1500 / speed);
    }
  });

  // Schedule next step
  scheduleNext(step.duration);
}

function scheduleNext(dur) {
  clearTimeout(stepTimer);
  const actualDur = dur / speed;
  elapsedMs = 0;

  // progress ticker
  clearInterval(progressTimer);
  const tickMs = 50;
  progressTimer = setInterval(() => {
    if (paused) return;
    elapsedMs += tickMs;
    updateProgress();
    if (elapsedMs >= actualDur) {
      clearInterval(progressTimer);
    }
  }, tickMs);

  stepTimer = setTimeout(() => {
    if (paused) return;
    const nextIdx = (currentStep + 1) % STEPS.length;
    if (nextIdx === 0) {
      cycleCount++;
      document.getElementById('cycleLabel').textContent = `CICLO ${cycleCount}`;
      // clear outputs for new cycle
      allOutputLines = [];
      document.getElementById('outputLines').innerHTML = '';
      aliveObjects.clear();
      Object.keys(OBJECTS_DEF).forEach(k => {
        const el = document.getElementById('obj-' + k);
        if (el) el.className = 'obj-card';
      });
    }
    activateStep(nextIdx);
  }, actualDur);
}

// ============================================================
// GLOBAL TIMER
// ============================================================
let globalMs = 0;
let globalInterval;

function startGlobalTimer() {
  clearInterval(globalInterval);
  globalInterval = setInterval(() => {
    if (paused) return;
    globalMs += 100;
    const sec = (globalMs / 1000).toFixed(1);
    document.getElementById('timerDisplay').textContent = sec.padStart(4,'0') + 's';
  }, 100);
}

function updateProgress() {
  const total = STEPS.reduce((a,s) => a + s.duration, 0) / speed;
  const stepsBefore = STEPS.slice(0, currentStep).reduce((a,s) => a + s.duration, 0) / speed;
  const pct = ((stepsBefore + elapsedMs) / total) * 100;
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
}

// ============================================================
// OUTPUT
// ============================================================
function addOutputLine(text, cls) {
  const container = document.getElementById('outputLines');
  const div = document.createElement('div');
  div.className = 'output-line ' + (cls || '');
  div.textContent = text;
  container.appendChild(div);
  requestAnimationFrame(() => div.classList.add('visible'));
  container.scrollTop = container.scrollHeight;
  allOutputLines.push(div);
}

// ============================================================
// CONTROLS
// ============================================================
document.getElementById('btnPlayPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPlayPause').textContent = paused ? '▶ REANUDAR' : '⏸ PAUSAR';
  if (!paused) {
    // resume: re-schedule with remaining time
    const step = STEPS[currentStep];
    const remaining = Math.max(0, step.duration / speed - elapsedMs);
    clearTimeout(stepTimer);
    stepTimer = setTimeout(() => {
      const nextIdx = (currentStep + 1) % STEPS.length;
      if (nextIdx === 0) {
        cycleCount++;
        document.getElementById('cycleLabel').textContent = `CICLO ${cycleCount}`;
        allOutputLines = [];
        document.getElementById('outputLines').innerHTML = '';
        aliveObjects.clear();
        Object.keys(OBJECTS_DEF).forEach(k => {
          const el = document.getElementById('obj-' + k);
          if (el) el.className = 'obj-card';
        });
      }
      activateStep(nextIdx);
    }, remaining);
  }
});

document.getElementById('btnRestart').addEventListener('click', () => {
  clearTimeout(stepTimer);
  clearInterval(progressTimer);
  clearInterval(globalInterval);
  paused = false;
  globalMs = 0;
  cycleCount = 1;
  aliveObjects.clear();
  allOutputLines = [];
  document.getElementById('outputLines').innerHTML = '';
  document.getElementById('btnPlayPause').textContent = '⏸ PAUSAR';
  document.getElementById('cycleLabel').textContent = 'CICLO 1';
  document.getElementById('timerDisplay').textContent = '00.0s';
  document.getElementById('progressFill').style.width = '0%';
  Object.keys(OBJECTS_DEF).forEach(k => {
    const el = document.getElementById('obj-' + k);
    if (el) el.className = 'obj-card';
  });
  buildStepsList();
  startGlobalTimer();
  activateStep(0);
});

document.getElementById('speedSelect').addEventListener('change', (e) => {
  speed = parseFloat(e.target.value);
});

// ============================================================
// INIT
// ============================================================
buildStepsList();
buildObjGrid();
startGlobalTimer();
activateStep(0);
</script>
